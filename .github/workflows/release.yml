name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y zip
      - name: Build and verify release files
        run: |
          xpi=$(scripts/build-xpi)
          version=$(python -c 'import json; print(json.load(open("manifest.json"))["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          python scripts/zotero-update-manifest.py \
            --xpi "$xpi" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$(basename "$xpi")" \
            --output dist/updates.json
          scripts/checksum-xpi "$xpi"
          node tests/test_zotero_extension.mjs
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
